<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FocusXScriptKing — Pro Scripts</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  /* [1] CSS ตั้งค่าธีมและการล็อกหน้าจอ */
  :root {
    --bg: #0a0a0f; --surface: #10101a; --surface2: #16162a; --border: #252540;
    --accent: #7c5cfc; --accent2: #00e5ff; --text: #e8e8f0;
    --muted: #6b6b8a; --discord: #5865F2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    width: 100%; overflow-x: hidden; /* ล็อกหน้าจอแนวนอน */
    background: var(--bg); color: var(--text); 
    font-family: 'Sarabun', sans-serif;
  }

  /* พื้นหลังลายตาราง */
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(124,92,252,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(124,92,252,0.03) 1px, transparent 1px);
    background-size: 30px 30px; z-index: -1;
  }

  /* Header (แบบเดิม) */
  header { 
    height: 64px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(10,10,15,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }

  .logo { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 0.8rem; }
  .logo span.bracket { color: var(--accent); }
  .logo span.dot { color: var(--accent2); }

  nav { display: flex; align-items: center; gap: 8px; }
  .nav-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
  .nav-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(124,92,252,0.08); }
  
  /* ปุ่ม Discord ด้านบน */
  .discord-btn { background: var(--discord); border-color: var(--discord); color: #fff; font-weight: 600; }
  .discord-btn:hover { background: #4752c4; border-color: #4752c4; }

  /* [2] Hero Section (คืนค่าดีไซน์แบบเดิมเป๊ะๆ) */
  .hero { position: relative; z-index: 5; text-align: center; padding: 90px 40px 60px; }
  
  /* ป้ายอัปเดตไฟกะพริบ */
  .hero-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(124,92,252,0.1); border: 1px solid rgba(124,92,252,0.3); border-radius: 100px; padding: 5px 14px; font-size: 0.78rem; color: var(--accent); font-family: 'JetBrains Mono', monospace; margin-bottom: 28px; letter-spacing: 0.5px; }
  .hero-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

  .hero h1 { font-size: 3.5rem; font-weight: 700; line-height: 1.1; margin-bottom: 20px; font-family: 'Sarabun', sans-serif; }
  .hero h1 .highlight { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  
  .hero p { font-size: 1.1rem; color: var(--muted); max-width: 500px; margin: 0 auto 36px; line-height: 1.7; font-weight: 300; }

  /* ปุ่มกดใหญ่สองปุ่ม (คืนค่าแบบเดิม) */
  .hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  
  .btn-primary { background: linear-gradient(135deg, var(--accent), #5a3fd4); color: #fff; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 24px rgba(124,92,252,0.35); transition: 0.25s; font-size: 0.95rem; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,92,252,0.5); }
  
  .btn-discord-hero { background: var(--discord); color: #fff; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(88,101,242,0.3); transition: 0.25s; font-size: 0.95rem; }
  .btn-discord-hero:hover { background: #4752c4; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(88,101,242,0.5); }

  /* [3] ส่วนของการ์ดสคริปต์ (ใช้ระบบ Dynamic และ No-Scroll ที่ชอบไว้) */
  .cards-section { position: relative; z-index: 5; max-width: 1100px; margin: 0 auto; padding: 0 40px 80px; }
  
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .section-title { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ''; width: 4px; height: 20px; background: linear-gradient(var(--accent), var(--accent2)); border-radius: 2px; }

  /* แถบ Filter */
  .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; scrollbar-width: none; }
  .filter-tab { white-space: nowrap; background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
  .filter-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(124,92,252,0.08); }

  /* Grid การ์ดสคริปต์ */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; transition: 0.25s; overflow: hidden; cursor: pointer; }
  .card:hover { border-color: rgba(124,92,252,0.5); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
  .card:active { transform: scale(0.98); }
  
  .card-header { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: start; }
  .icon-box { width: 35px; height: 35px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .card-badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .badge { font-size: 0.65rem; font-family: 'JetBrains Mono'; font-weight: 800; padding: 2px 8px; border-radius: 4px; background: rgba(0,229,255,0.1); color: var(--accent2); text-transform: uppercase; border: 1px solid rgba(0,229,255,0.25); }

  .card h3 { font-size: 1rem; margin-bottom: 5px; color: var(--text); }
  .card p { font-size: 0.8rem; color: var(--muted); margin-bottom: 15px; line-height: 1.5; }

  /* กล่องพรีวิวโค้ดสั้นๆ */
  .preview-box { background: #07070c; padding: 10px; border-radius: 6px; font-family: 'JetBrains Mono'; font-size: 0.7rem; color: #5c6370; margin-bottom: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border: 1px solid rgba(255,255,255,0.03); }

  /* ปุ่ม Copy หน้าแรก */
  .copy-btn { width: 100%; padding: 10px; background: rgba(124,92,252,0.1); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; font-family: 'JetBrains Mono'; transition: 0.2s; }
  .copy-btn:hover { background: var(--accent); color: white; }

  /* Modal Popup ตัวเต็ม */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); transition: opacity 0.2s; }
  .modal { background: var(--surface2); width: 100%; max-width: 500px; border-radius: 15px; padding: 32px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
  .modal h2 { font-size: 1.2rem; margin-bottom: 20px; font-weight: 700; }
  .modal-code { background: #05050a; padding: 20px; border-radius: 10px; margin-bottom: 20px; font-family: 'JetBrains Mono'; font-size: 0.75rem; overflow-x: auto; white-space: pre; color: #abb2bf; border: 1px solid var(--border); line-height: 1.6; }

  /* การตอบสนองตามขนาดหน้าจอ */
  @media (max-width: 480px) {
    header { padding: 0 15px; height: 60px; }
    .hero { padding: 60px 15px 40px; }
    .hero h1 { font-size: 2.2rem; }
    .hero p { font-size: 1rem; }
    .btn-group { flex-direction: column; gap: 8px; }
    .cards-section { padding: 0 15px 50px; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="bracket">[</span> <span class="name">FocusXScript</span> <span class="dot">King</span> <span class="bracket">]</span>
  </div>
  <nav>
    <a href="#scripts" class="nav-btn">📜 Scripts</a>
    <a href="https://discord.gg/AxUVsYS8pJ" target="_blank" class="nav-btn discord-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px;"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.042.031.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Discord
    </a>
  </nav>
</header>

<section class="hero">
  <div class="hero-badge">v2.5.0 — Latest Update</div>
  <h1>Free <span class="highlight">Scripts</span><br>Pro Quality</h1>
  <p>A collection of scripts for Roblox and more. Download for free. Join Discord to get new scripts before anyone else.</p>
  <div class="hero-actions">
    <a href="#scripts" class="btn-primary">🚀 Browse All Scripts</a>
    <a href="https://discord.gg/AxUVsYS8pJ" target="_blank" class="btn-discord-hero">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.042.031.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Join Discord Server
    </a>
  </div>
</section>

<section class="cards-section" id="scripts">
  <div class="section-header">
    <div class="section-title">All Scripts</div>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-tab active" onclick="filterScripts('all', this)">All</button>
    <button class="filter-tab" onclick="filterScripts('evade', this)">Evade</button>
    <button class="filter-tab" onclick="filterScripts('Kick a Lucky Block', this)">Kick a Lucky Block</button>
  </div>

  <div class="cards-grid" id="cardsGrid">
    </div>
</section>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target==this) this.style.display='none'">
  <div class="modal">
    <h2 id="mTitle"></h2>
    <div class="modal-code" id="mCode"></div>
    <button class="modal-copy-btn" onclick="copyFromModal()">Copy</button>
  </div>
</div>

<script>
/* =========================================
   [4] ส่วนจัดการข้อมูลสคริปต์ (แก้ง่ายเหมือนเดิม!)
   ========================================= */
const MY_SCRIPTS = [
  {
    title: "[ FocusXScript ] EVADE",
    category: "evade",
    icon: "⚡",
    badges: ["NEW", "NO KEY"], // เพิ่มแบดจ์ได้หลายตัว
    iconColor: "rgba(124, 92, 252, 0.1)", // สีพื้นหลังไอคอน
    desc: "evade script v1.2",
    // วางสคริปต์เต็มๆ ในช่อง content (ใช้เครื่องหมาย ` ครอบ)
    content: `loadstring(game:HttpGet("https://raw.githubusercontent.com/FocusXScriptKing/Evade-Script/refs/heads/main/evade-script", true))()`
  },
  {
    title: "[ Ajjans Hub ] Kick a Lucky Block",
    category: "Kick a Lucky Block",
    icon: "🍎",
    badges: ["HOT", "NO KEY"],
    iconColor: "rgba(229, 0, 50, 0.1)", // สีไอคอนแดง
    desc: "Auto farm level and collect fruits.",
    content: `loadstring(game:HttpGet("https://api.luarmor.net/files/v4/loaders/339a2957388227ef58c0d1bffab6de85.lua"))()`
  }
];

/* =========================================
   [5] ระบบทำงานอัตโนมัติ (คืนค่าสไตล์การ์ดเดิม)
   ========================================= */

window.onload = () => renderCards('all');

function renderCards(filter) {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  
  MY_SCRIPTS.forEach(item => {
    if (filter !== 'all' && item.category !== filter) return;

    // คืนค่าโครงสร้างและสไตล์การ์ดเดิม
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(item.title, item.content);
    
    let badgesHtml = item.badges.map(badge => `<span class="badge">${badge}</span>`).join('');

    card.innerHTML = `
      <div class="card-header">
        <div class="icon-box" style="background:${item.iconColor || 'rgba(124,92,252,0.1)'}">${item.icon}</div>
        <div class="card-badges">${badgesHtml}</div>
      </div>
      <h3>${item.title}</h3>
      <p>${item.desc}</p>
      <div class="preview-box">${item.content.substring(0, 40)}...</div>
      <button class="copy-btn" onclick="event.stopPropagation(); quickCopy(this, \`${item.content}\`)">COPY</button>
    `;
    grid.appendChild(card);
  });
}

function quickCopy(btn, text) {
  navigator.clipboard.writeText(text);
  const oldText = btn.innerText;
  btn.innerText = '✓ COPIED';
  btn.style.background = '#00e676'; btn.style.color = '#fff';
  setTimeout(() => { 
    btn.innerText = oldText; 
    btn.style.background = ''; btn.style.color = '';
  }, 2000);
}

function openModal(title, code) {
  document.getElementById('mTitle').innerText = title;
  document.getElementById('mCode').innerText = code;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function copyFromModal() {
  const code = document.getElementById('mCode').innerText;
  navigator.clipboard.writeText(code);
  alert('Copied to clipboard!');
}

function filterScripts(cat, btn) {
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderCards(cat);
}
</script>

</body>
</html>
